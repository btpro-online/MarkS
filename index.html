  /* Hiện hình camera bằng canvas (giữ đúng tỉ lệ, phủ kín màn hình) */
  function qrLivePaint() {
    if (!QL.el) return;
    const v = QL.el.querySelector('video'),
      c = QL.el.querySelector('.ql-cv');
    if (v.videoWidth) {
      const w = c.clientWidth || 320,
        h = c.clientHeight || 480,
        dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (c.width !== Math.round(w * dpr)) {
        c.width = Math.round(w * dpr);
        c.height = Math.round(h * dpr);
      }
      const k = Math.max(c.width / v.videoWidth, c.height / v.videoHeight),
        dw = v.videoWidth * k,
        dh = v.videoHeight * k;
      c.getContext('2d').drawImage(v, (c.width - dw) / 2, (c.height - dh) / 2, dw, dh);
    }
    QL.raf = requestAnimationFrame(qrLivePaint);
  }
  async function qrLiveTick() {
    if (!QL.el || QL.busy) return;
    QL.busy = true;
    let text = null;
    try {
      const v = QL.el.querySelector('video');
      if (v.videoWidth && v.readyState >= 2) {
        if (QL.det) {
          try {
            const r = await QL.det.detect(v);
            if (r && r.length && r[0].rawValue) text = r[0].rawValue;
          } catch (e) {
            QL.det = null;
          }
        }
        if (!text && window.jsQR) {
          const k = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight)) * (QL.n++ % 3 === 2 ? 0.6 : 1),
            w = Math.round(v.videoWidth * k),
            h = Math.round(v.videoHeight * k);
          const c = QL.work || (QL.work = document.createElement('canvas'));
          c.width = w;
          c.height = h;
          const x = c.getContext('2d', { willReadFrequently: true });
          x.drawImage(v, 0, 0, w, h);
          const d = x.getImageData(0, 0, w, h),
            r = window.jsQR(d.data, w, h, { inversionAttempts: QL.n % 2 ? 'attemptBoth' : 'dontInvert' });
          if (r && r.data) text = r.data;
        }
      }
    } catch (e) {
      /* quét khung sau */
    }
    QL.busy = false;
    if (!QL.el) return;
    if (text) {
      const res = parseQrKey(text);
      if (!res.error) {
        try {
          beepDone();
        } catch (e) {}
        qrLiveClose();
        qrFromText(text, false);
        return;
      }
      if (text !== QL.bad) {
        QL.bad = text;
        qrLiveMsg('Thấy mã QR nhưng không phải bộ đáp án. Thử mã khác.', true);
      }
    }
    QL.timer = setTimeout(qrLiveTick, 120);
  }

    e.innerHTML =
      tab === 'key'
        ? '<div><b>Bước 1/2 · Nhập đáp án</b><span>Nhập từ file Excel, mã QR hoặc chọn tay bên dưới.</span></div><button type="button" class="btn small primary" id="wizNext">Tiếp: danh sách lớp ›</button>'
        : '<div><b>Bước 2/2 · Danh sách lớp</b><span>Chọn file Excel/CSV danh sách thí sinh, hoặc bỏ qua nếu chưa có.</span></div><button type="button" class="btn small primary" id="wizNext">Xong, bắt đầu chấm ›</button>';
    $('#wizNext').onclick = function () {
      if (tab === 'key') showTab('stu');
      else {
        WIZ = null;
        showTab('scan');
      }
    };
  }
  $('#homeFab').onclick = function () {
    homeUI = { mode: 'new', name: '', sheet: SHEET_INFO[homeUI.sheet] ? homeUI.sheet : 'f', copy: '', ren: null, del: null, rn: '' };
    renderHome();
    window.scrollTo(0, 0);
    const i = $('#hnName');
    if (i) i.focus();
  };

  /* ---------- Khởi động ---------- */
  renderSheetSel();
  renderChip();
  renderScan();
  showHome();
  const first = function () {
    if (!scan && !document.body.classList.contains('in-home'))
      runPhoto(function () {
        return makeSample().then(function (s) {
          return s.canvas;
        });
      }, 'sample');
  };
  if (document.fonts && document.fonts.ready)
    document.fonts.ready.then(function () {
      setTimeout(first, 30);
    });
  else setTimeout(first, 200);
  window.__omr = {
    makeSample: makeSample,
    analyze: analyze,
    getScan: function () {
      return scan;
    },
    cfg: function () {
      return cfg;
    },
    grade: function () {
      return scan && !scan.error ? grade() : null;
    },
    renderPhoto: function (marks, o) {
      return curSheetImg().then(function (img) {
        return renderPhoto(img, cfg, marks, o);
      });
    },
    setSheet: function (id) {
      return switchSheet(id);
    },
    SHEET: function () {
      return SHEET;
    },
    buildMarks: function () {
      return buildMarks(curVer());
    },
    parseQrKey: parseQrKey,
    decodeQrCanvas: decodeQrCanvas,
    startLive: startLive,
    lvStop: lvStop,
    LV: LV,
    SND: SND
  };

  /* Giữ thanh tab cố định kích thước khi người dùng phóng to (pinch-zoom hoặc zoom trang) */
  (function () {
    const tb = document.querySelector('.tabs'),
      vv = window.visualViewport;
    if (!tb) return;
    const dpr0 = window.devicePixelRatio || 1;
    function fix() {
      try {
        const sc = vv ? vv.scale || 1 : 1,
          dz = dpr0 / (window.devicePixelRatio || dpr0);
        tb.style.zoom = Math.abs(dz - 1) > 0.02 && dz > 0 ? String(dz) : '';
        if (vv && Math.abs(sc - 1) > 0.01) {
          tb.style.transform = tb.style.width = '';
          const dy = vv.offsetTop + vv.height - tb.getBoundingClientRect().bottom,
            dx = vv.offsetLeft;
          tb.style.transformOrigin = 'left bottom';
          tb.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + 1 / sc + ')';
          tb.style.width = sc * 100 + '%';
        } else {
          tb.style.transform = tb.style.transformOrigin = tb.style.width = '';
        }
      } catch (e) {}
    }
    if (vv) {
      vv.addEventListener('resize', fix);
      vv.addEventListener('scroll', fix);
    }
    window.addEventListener('resize', fix);
    fix();
  })();
})();
</script>

</body></html>
