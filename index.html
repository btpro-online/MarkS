<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>B&amp;T Pro Mark</title>
<meta name="theme-color" content="#1c3f94">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="B&amp;T Pro Mark">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html,body{margin:0;padding:0}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Itim&display=swap">
<style>
/* Bố cục: một cột, thanh tab dưới cùng; nền ô li vở; điểm viết tay bằng bút đỏ. */
:root {
  --bg: #f5f6f9;
  --grid: rgba(36, 72, 168, 0.065);
  --card: #ffffff;
  --fg: #1a2033;
  --muted: #5a647a;
  --line: #d6dce8;
  --ink: #1c3f94;
  --ink-fg: #ffffff;
  --ink-soft: #e6edfb;
  --red: #c92d26;
  --red-soft: #fce8e6;
  --ok: #12794a;
  --ok-soft: #dcf2e6;
  --warn: #8f5a00;
  --warn-soft: #fcefd0;
  --f-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-hand: 'Itim', 'Be Vietnam Pro', 'Comic Sans MS', cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #0e1218;
    --grid: rgba(143, 176, 255, 0.055);
    --card: #171c26;
    --fg: #e8ebf2;
    --muted: #98a2b8;
    --line: #29313f;
    --ink: #8fb0ff;
    --ink-fg: #0b1330;
    --ink-soft: #1b2a4f;
    --red: #ff7d72;
    --red-soft: #3b1b1a;
    --ok: #62d49c;
    --ok-soft: #143122;
    --warn: #f2c14e;
    --warn-soft: #36290f;
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --bg: #0e1218;
  --grid: rgba(143, 176, 255, 0.055);
  --card: #171c26;
  --fg: #e8ebf2;
  --muted: #98a2b8;
  --line: #29313f;
  --ink: #8fb0ff;
  --ink-fg: #0b1330;
  --ink-soft: #1b2a4f;
  --red: #ff7d72;
  --red-soft: #3b1b1a;
  --ok: #62d49c;
  --ok-soft: #143122;
  --warn: #f2c14e;
  --warn-soft: #36290f;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
html,
body {
  min-height: 100%;
}
body {
  font: 400 15px/1.5 var(--f-body);
  color: var(--fg);
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  padding-block: 14px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h2 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}
.vh {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* Đầu trang */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.brand .logo { flex: none; width: 40px; height: 40px; border-radius: 50%; }
.brand svg {
  flex: none;
  color: var(--red);
}
.brand h1 {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.pill {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--ink-soft);
  color: var(--ink);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

/* Thẻ và nút */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.row > * {
  min-width: 0;
}
.lbl {
  font-size: 13px;
  color: var(--muted);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--fg);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
}
.btn:active {
  transform: translateY(1px);
}
.btn.primary {
  background: var(--ink);
  color: var(--ink-fg);
  border-color: var(--ink);
}
.btn.big {
  min-height: 56px;
  font-size: 16px;
  flex: 1 1 100%;
}
.btn.ghost {
  background: transparent;
}
.btn.danger {
  color: var(--red);
}
.btn[disabled] {
  opacity: 0.55;
  cursor: default;
}
.btn.small {
  min-height: 36px;
  padding: 0 12px;
  font-size: 13px;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.actions .btn:not(.big) {
  flex: 1 1 140px;
}
.hint {
  font-size: 13px;
  color: var(--muted);
}
.note {
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 10px;
  background: var(--warn-soft);
  color: var(--warn);
}
.note.err {
  background: var(--red-soft);
  color: var(--red);
}
.note b {
  font-weight: 700;
}
.tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--warn-soft);
  color: var(--warn);
}

/* Điểm viết tay */
.gradebox {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.grade {
  position: relative;
  display: inline-flex;
  align-items: baseline;
  gap: 2px;
  padding: 8px 22px 6px;
  color: var(--red);
  font-family: var(--f-hand);
  line-height: 1;
  transform: rotate(-3deg);
}
.grade .num {
  font-size: 60px;
  font-variant-numeric: tabular-nums;
}
.grade .of {
  font-size: 24px;
  opacity: 0.85;
}
.grade svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.sum {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.sum strong {
  font-size: 17px;
  font-variant-numeric: tabular-nums;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  font-size: 12px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--ink-soft);
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.chip.bad {
  background: var(--red-soft);
  color: var(--red);
}
.chip.ok {
  background: var(--ok-soft);
  color: var(--ok);
}
.chip.mid {
  background: var(--warn-soft);
  color: var(--warn);
}

/* Ô nhập */
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.field input,
.field textarea {
  min-height: 42px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  width: 100%;
}
.field textarea {
  min-height: 64px;
  resize: vertical;
  font-family: var(--f-body);
}
.mono {
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.12em;
  font-weight: 600;
}
.fields {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
}
.stepper {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.stepper button {
  width: 44px;
  height: 42px;
  border: 0;
  background: var(--bg);
  font-size: 20px;
  cursor: pointer;
}
.stepper output {
  min-width: 48px;
  text-align: center;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.seg {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}
.seg button {
  min-height: 42px;
  padding: 0 14px;
  border: 0;
  background: var(--bg);
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
}
.seg button[aria-pressed='true'] {
  background: var(--ink);
  color: var(--ink-fg);
}
.num-in {
  width: 84px;
  min-height: 42px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  text-align: center;
  font-weight: 700;
}
input[type='range'] {
  width: 100%;
  accent-color: var(--ink);
}
.range-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.range-lbls {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
}

/* Lưới đáp án */
.qgrid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  --chip: 28px;
}
.qgrid.k5 {
  --chip: 25px;
}
.q {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 6px 2px 0;
  border-radius: 8px;
  min-width: 0;
}
.q.bad {
  background: var(--red-soft);
}
.q.mid {
  background: var(--warn-soft);
}
.qn {
  width: 22px;
  text-align: right;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  flex: none;
}
.opts {
  display: flex;
  gap: 4px;
}
.o {
  width: var(--chip);
  height: var(--chip);
  border-radius: 50%;
  border: 1.5px solid var(--line);
  background: var(--card);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  padding: 0;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.o.sel {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--ink-fg);
}
.o.sel.ok {
  background: var(--ok);
  border-color: var(--ok);
  color: var(--card);
}
.o.sel.bad {
  background: var(--red);
  border-color: var(--red);
  color: var(--card);
}
.o.key {
  border: 2px dashed var(--ok);
  color: var(--ok);
}

.vchips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.vchip {
  min-height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
}
.vchip[aria-pressed='true'] {
  background: var(--ink);
  color: var(--ink-fg);
  border-color: var(--ink);
}

canvas.photo {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 8px;
  background: #222;
}
.sheetimg {
  display: block;
  width: 100%;
  max-width: 520px;
  height: auto;
  margin: 0 auto;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fff;
}

/* Kết quả đã lưu */
.stats {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.stats b {
  color: var(--fg);
  font-size: 16px;
}
.hist {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 64px;
}
.hist i {
  flex: 1;
  background: var(--ink);
  border-radius: 3px 3px 0 0;
  min-height: 2px;
  opacity: 0.85;
}
.hist-ax {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.list {
  display: flex;
  flex-direction: column;
}
.item {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}
.item:first-child {
  border-top: 0;
}
.item .who {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.item .meta {
  font-size: 12px;
  color: var(--muted);
}
.item .sc {
  font-family: var(--f-hand);
  font-size: 24px;
  color: var(--red);
  font-variant-numeric: tabular-nums;
}
.item button {
  width: 36px;
  height: 36px;
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 8px;
  color: var(--muted);
  cursor: pointer;
}
.empty {
  text-align: center;
  color: var(--muted);
  padding: 18px 8px;
  font-size: 14px;
}

.spin {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 3px solid var(--ink-soft);
  border-top-color: var(--ink);
  animation: sp 0.8s linear infinite;
}
@keyframes sp {
  to {
    transform: rotate(360deg);
  }
}
.busy {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  padding: 22px;
  color: var(--muted);
}
@media (prefers-reduced-motion: reduce) {
  .spin {
    animation-duration: 3s;
  }
  .btn:active {
    transform: none;
  }
}

/* Thanh tab dưới */
.tabs {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  display: flex;
  justify-content: center;
  background: var(--card);
  border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px))
    max(8px, env(safe-area-inset-left, 0px));
}
.tabs > div {
  display: flex;
  width: 100%;
  max-width: 640px;
  gap: 4px;
}
.tab {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  position: relative;
}
.tab[aria-current='page'] {
  color: var(--ink);
  background: var(--ink-soft);
}
.tab svg {
  width: 22px;
  height: 22px;
}
.tab .bd {
  position: absolute;
  top: 2px;
  left: calc(50% + 6px);
  min-width: 16px;
  padding: 0 4px;
  height: 16px;
  border-radius: 8px;
  background: var(--red);
  color: var(--card);
  font-size: 10px;
  line-height: 16px;
  text-align: center;
}

/* Phiếu 3 phần */
.prow {
  display: grid;
  grid-template-columns: 1fr auto 84px;
  gap: 8px;
  align-items: center;
}
.prow.head {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}
.prow.head span:first-child {
  text-align: left;
}
.pl {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.pl small {
  color: var(--muted);
  font-size: 12px;
}
.prow .num-in {
  width: 100%;
}
.fields.one {
  grid-template-columns: 1fr;
}
.seg.full {
  display: flex;
  width: 100%;
}
.seg.full button {
  flex: 1;
}
h3.ph {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin: 8px 0 0;
}
.tflist {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tfq {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas: 'q t' 's s';
  gap: 4px 8px;
  padding: 6px 8px;
  border-radius: 8px;
  min-width: 0;
  align-items: center;
}
.tfq.bad {
  background: var(--red-soft);
}
.tfq.mid {
  background: var(--warn-soft);
}
.tqn {
  grid-area: q;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}
.sts {
  grid-area: s;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  flex-wrap: wrap;
}
.tail {
  grid-area: t;
  font-size: 13px;
}
.st {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.st i {
  font-style: normal;
  font-size: 11px;
  color: var(--muted);
  width: 10px;
  text-align: right;
}
.o.tf {
  width: 28px;
  height: 28px;
  font-size: 12px;
}
.numlist {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}
.numq {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 2px 8px;
  align-items: center;
  padding: 6px 8px;
  border-radius: 8px;
  border: 1px solid var(--line);
  min-width: 0;
}
.numq.bad {
  background: var(--red-soft);
  border-color: transparent;
}
.numq.mid {
  background: var(--warn-soft);
  border-color: transparent;
}
.numq.good {
  background: var(--ok-soft);
  border-color: transparent;
}
.numq .tqn {
  grid-area: auto;
}
.numin {
  width: 100%;
  min-width: 0;
  min-height: 36px;
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--card);
  text-align: center;
}
.keyv {
  grid-column: 1 / -1;
  font-size: 12px;
  color: var(--muted);
}
.keyv b {
  color: var(--fg);
}
.item .meta {
  overflow-wrap: anywhere;
}

/* Nhập bằng mã QR */
.note.ok {
  background: var(--ok-soft);
  color: var(--ok);
}
.qrprev {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
}
.qrpaste summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--ink);
  font-weight: 600;
  padding: 6px 0;
}
.qrpaste[open] summary {
  margin-bottom: 6px;
}
.qrpaste .actions {
  margin-top: 8px;
}

/* ---- Quét trực tiếp ---- */
.live {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #000;
  color: #fff;
  display: flex;
  flex-direction: column;
}
.live[hidden] {
  display: none;
}
.live video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
  opacity: 0;
  pointer-events: none;
}
.live canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.lv-top,
.lv-bottom {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px max(16px, env(safe-area-inset-left)) 12px max(16px, env(safe-area-inset-right));
}
.lv-top {
  padding-top: max(12px, env(safe-area-inset-top));
  background: linear-gradient(#000a, #0000);
}
.lv-bottom {
  margin-top: auto;
  flex-direction: column;
  align-items: stretch;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
  background: linear-gradient(#0000, #000b);
}
.lv-btn {
  border: 1px solid #fff6;

function makeLayout(cfg) {
  const L = { p1: [], p2: [], p3: [], sbd: [], md: [] };
  for (let q = 0; q < cfg.n1; q++)
    for (let o = 0; o < 4; o++)

        q: q,
        o: o,
        x: P1_X[Math.floor(q / P1N)][o],
        y: P1_Y[q % P1N]
      });
  for (let q = 0; q < cfg.n2; q++)
    for (let r = 0; r < 4; r++)
      for (let s = 0; s < 2; s++)
        L.p2.push({
          blk: 'p2-' + q,
          q: q,
          r: r,
          s: s,
          x: P2_X[q][s],
          y: Array.isArray(P2_Y[0]) ? P2_Y[q][r] : P2_Y[r]
        });
  for (let q = 0; q < cfg.n3; q++) {
    L.p3.push({ blk: 'p3-' + q, q: q, c: 0, k: '-', x: P3_X[q][0], y: P3_DASH });
    L.p3.push({ blk: 'p3-' + q, q: q, c: 1, k: ',', x: P3_X[q][1], y: P3_COMMA });

    for (let d = 0; d < 10; d++) L.md.push({ blk: 'md', c: c, d: d, x: MD_X[c], y: ID_Y[d] });

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Chuyển chuỗi đáp án Phần III thành các ô cần tô (dùng cho ảnh mẫu). */
function numToCells(str) {
  const cells = [];
  String(str)
    .replace(/\s+/g, '')
    .split('')
    .slice(0, 4)
    .forEach(function (ch, c) {
      if (ch === '-') cells.push({ c: 0, k: '-' });
      else if (ch === ',' || ch === '.') cells.push({ c: c, k: ',' });
      else if (/\d/.test(ch)) cells.push({ c: c, k: ch });
    });
  return cells;
}
/* Tô bút lên ảnh phiếu (ctx đã scale 1 đơn vị = 1 mm). */
function drawMarks(ctx, L, marks, seed) {
  const rng = mulberry32(seed || 7);
  function pen(b) {
    ctx.fillStyle = 'rgba(24,24,40,' + (marks.alpha || 0.9) + ')';
    for (let t = 0; t < 2; t++) {
      ctx.beginPath();
      ctx.ellipse(
        b.x + (rng() - 0.5) * 0.3,
        b.y + (rng() - 0.5) * 0.3,
        RB * (marks.cover || 1) * (0.82 + rng() * 0.14),
        RB * (marks.cover || 1) * (0.82 + rng() * 0.14),
        rng() * 3,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }
  }
  L.p1.forEach(function (b) {
    if (marks.p1[b.q] && marks.p1[b.q].indexOf(b.o) >= 0) pen(b);
  });
  L.p2.forEach(function (b) {
    const v = marks.p2[b.q] && marks.p2[b.q][b.r];
    if ((v === 'D' && b.s === 0) || (v === 'S' && b.s === 1) || v === 'X') pen(b);
  });
  L.p3.forEach(function (b) {
    const cells = numToCells(marks.p3[b.q] || '');
    if (
      cells.some(function (m) {
        return m.c === b.c && m.k === b.k;
      })
    )
      pen(b);
  });
  L.sbd.forEach(function (b) {
    if (marks.sbd && marks.sbd[b.c] === String(b.d)) pen(b);
  });
  L.md.forEach(function (b) {
    if (marks.md && marks.md[b.c] === String(b.d)) pen(b);
  });
}

    if (v === undefined) {
      v = bubbleScore(g, w, h, hOf(HB, b.y), b, inOff, A0, A1);
      cache.set(b, v);
    }
    return v;
  };
  /* Mức "nền": phần lớn ô trên phiếu để trống nhưng vẫn có nét in và nhiễu nên có độ tối nhất định. Lấy
     trung vị làm nền rồi trừ đi, đỡ đọc nhầm khi ảnh thiếu sáng hoặc ám màu. */
  const allB = [].concat(L.p1, L.p2, L.p3, L.sbd, L.md),
    sv = allB.map(raw).sort(function (p, q) {
      return p - q;
    });
  const base = sv.length ? Math.min(sv[Math.floor(sv.length * 0.5)], 0.25) : 0;
  /* Ô số báo danh và mã đề có in sẵn chữ số bên trong nên mỗi chữ số tối khác nhau (số 8 tối hơn số 1), và
     mỗi cột có thể sáng/tối khác nhau do ánh sáng. Mỗi cột chỉ tô tối đa một ô nên trung vị của cột là mức
     nền của cột; sau khi trừ, trung vị theo chữ số (trên cả các cột số báo danh và mã đề) là mức nền của chữ
     số đó. Nhờ vậy cột để trống không bị đọc nhầm thành đã tô. */
  const idB = [].concat(L.sbd, L.md),
    med = function (a) {
      const s = a.slice().sort(function (p, q) {
        return p - q;
      });
      return s.length ? s[Math.floor((s.length - 1) / 2)] : 0;
    },
    colV = {},
    colOff = {},
    digV = [];
  idB.forEach(function (b) {
    const k = b.blk + '-' + b.c;
    (colV[k] = colV[k] || []).push(raw(b));
  });
  Object.keys(colV).forEach(function (k) {
    colOff[k] = med(colV[k]);
  });
  for (let d = 0; d < 10; d++) digV.push([]);
  idB.forEach(function (b) {
    digV[b.d].push(raw(b) - colOff[b.blk + '-' + b.c]);
  });
  const digOff = digV.map(function (a) {
      const s = a.slice().sort(function (p, q) {
        return p - q;
      });
      return s.length ? s[Math.floor((s.length >= 8 ? 0.5 : 0.2) * (s.length - 1))] : 0;
    }),
    idRd = function (b) {
      return Math.max(0, raw(b) - colOff[b.blk + '-' + b.c] - digOff[b.d]);
    };
  const rd = function (b) {
    return b.blk === 'sbd' || b.blk === 'md' ? idRd(b) : Math.max(0, raw(b) - base);
  };
  /* Mức nhiễu: trong mỗi nhóm lựa chọn (một câu Phần I, một cột Phần III, một cột số báo danh hoặc mã đề)
     chỉ tối đa một ô được tô nên ô cao thứ hai chính là nhiễu. Lấy trung vị làm sàn, ô nào không vượt rõ
     rệt sàn này thì không tính là đã tô. */
  const second = [],
    grp = {};
  [].concat(L.p1, L.p3, L.sbd, L.md).forEach(function (b) {
    const k =
      b.blk.charAt(1) === '1'
        ? 'p1-' + b.q
        : b.blk.charAt(0) === 'p'
          ? 'p3-' + b.q + '-' + b.c
          : b.blk + '-' + b.c;
    (grp[k] = grp[k] || []).push(rd(b));
  });
  Object.keys(grp).forEach(function (k) {
    const a = grp[k].slice().sort(function (p, q) {
      return q - p;
    });
    if (a.length >= 3) second.push(a[1]);
  });
  second.sort(function (p, q) {
    return p - q;
  });
  const noise = second.length ? second[Math.floor(second.length / 2)] : 0;
  thr = Math.max(thr, 2.2 * noise);
  let marked = 0,
    seen = 0;
  const p1 = [],
    p1s = [];
  for (let q = 0; q < cfg.n1; q++) {
    p1.push([]);
    p1s.push([]);
  }
  L.p1.forEach(function (b) {
    p1s[b.q][b.o] = rd(b);
  });
  for (let q = 0; q < cfg.n1; q++) {
    p1[q] = decideMarks(p1s[q], thr);
    marked += p1[q].length;
    seen += 4;
  }
  const p2 = [],
    p2s = [];
  for (let q = 0; q < cfg.n2; q++) {
    p2.push(['', '', '', '']);
    p2s.push([
      [0, 0],
      [0, 0],
      [0, 0],
      [0, 0]
    ]);
  }
  L.p2.forEach(function (b) {
    p2s[b.q][b.r][b.s] = rd(b);
  });
  for (let q = 0; q < cfg.n2; q++)
    for (let r = 0; r < 4; r++) {
      const m = decideMarks(p2s[q][r], thr);
      p2[q][r] = m.length === 2 ? 'X' : m.length === 1 ? (m[0] === 0 ? 'D' : 'S') : '';
      marked += m.length;
      seen += 2;
    }
  const p3c = [];
  for (let q = 0; q < cfg.n3; q++) {
    p3c.push([[], [], [], []]);
  }
  L.p3.forEach(function (b) {
    p3c[b.q][b.c].push({ k: b.k, s: rd(b) });
  });
  const p3 = [];
  for (let q = 0; q < cfg.n3; q++) {
    let str = '';
    for (let c = 0; c < 4; c++) {
      const cell = p3c[q][c],
        m = decideMarks(
          cell.map(function (e) {
            return e.s;
          }),
          thr
        );
      if (m.length === 1) str += cell[m[0]].k;
      else if (m.length > 1) str += '?';
      marked += m.length;
      seen += cell.length;
    }
    p3.push(str);
  }
  function readId(cells, cols) {
    const sc = [],
      out = [];
    for (let c = 0; c < cols; c++) sc.push([]);
    cells.forEach(function (b) {
      sc[b.c][b.d] = rd(b);
    });
    for (let c = 0; c < cols; c++) {
      const m = decideMarks(sc[c], Math.max(thr, SHEET.ORIENT === 'rings' ? 0.1 : 0));
      out.push(m.length === 1 ? String(m[0]) : m.length === 0 ? '_' : '?');
    }
    return out;
  }
  const sbd = readId(L.sbd, L.sbdN),
    md = readId(L.md, L.mdN);
  return {
    p1: p1,
    p2: p2,
    p3: p3,
    p1s: p1s,
    sbd: sbd,
    md: md,
    markedRatio: seen ? marked / seen : 0,
    base: base,
    noise: noise,
    thrEff: thr
  };
}

/* hint (không bắt buộc): { pts } = 4 góc phiếu theo thứ tự trái-trên, phải-trên, phải-dưới, trái-dưới (toạ độ
   điểm ảnh của ảnh đang phân tích), dùng khi người chấm đặt phiếu thẳng trong khung nhưng ảnh quá tối/mờ nên
   không tự tìm được ô neo hoặc không phân biệt được chiều phiếu bằng các vòng tròn in sẵn. */
function analyzeImage(imgData, w, h, cfg, thr, hint) {
  const L = makeLayout(cfg);
  const g = redOf(imgData.data, w * h),
    gm = markGray(imgData.data, w * h);
  const cands = findMarkers(imgData.data, w, 0, 0, w, h);
  let fit = null,
    err = null;
  if (cands.length < 4) err = { error: 'markers', found: cands.length };
  else {
    const quad = pickQuad(cands, w, h, { d: imgData.data, w: w, h: h });
    if (!quad) err = { error: 'quad' };
    else {
      fit = orient(gm, w, h, quad.pts, cands);
      if (!fit) err = { error: 'orient' };
    }
  }
  if (!fit && hint && hint.pts && hint.pts.length === 4) {
    const P = hint.pts,
      H = solveHomography(CORNERS, P);
    if (H)
      fit = {
        H: H,
        P: P,
        bar: 0,
        raw: 0,
        mid: midHits(H, P, cands),
        ref: paperRef(gm, w, h, H),
        hinted: true
      };
  }
  if (!fit) return err;
  const ppm = (dist(fit.P[0], fit.P[1]) + dist(fit.P[3], fit.P[2])) / 2 / (CORNERS[1][0] - CORNERS[0][0]);
  const bands = buildBands(fit, cands, ppm, { d: imgData.data, w: w, h: h });
  const res = scanSheet(g, w, h, L, cfg, bands.H, thr, gm);
  res.L = L;
  res.HB = bands.H;
  res.P = fit.P;
  res.ppm = ppm;
  res.foundMid = bands.foundMid;
  res.anchors = bands.anchors;
  return res;
}

/* ---------- Chấm điểm ---------- */
function normNum(s) {
  return String(s).replace(/\s+/g, '').replace(/[−–]/g, '-').replace(/\./g, ',');
}
function numEq(a, b) {
  a = normNum(a);
  b = normNum(b);
  if (a === b) return true;
  if (a.indexOf('?') >= 0 || !a || !b) return false;
  const x = parseFloat(a.replace(',', '.')),
    y = parseFloat(b.replace(',', '.'));
  return isFinite(x) && isFinite(y) && Math.abs(x - y) < 1e-9;
}
/* Đáp án có thể có nhiều lựa chọn: Phần I là số hoặc mảng số, Phần II là 'D', 'S' hoặc 'DS' (đúng sai đều
   được). */
function keyArr(x) {
  return x === null || x === undefined ? [] : Array.isArray(x) ? x : [x];
}
function tfHas(kv, v) {
  return kv !== null && kv !== undefined && typeof kv === 'string' && kv.indexOf(v) >= 0;
}
const TF_LADDER = [0, 0.1, 0.25, 0.5, 1];
/* Bảng điểm theo cấu trúc đề tốt nghiệp THPT: (số câu P.I, P.II, P.III) -> điểm mỗi câu P.I, P.II, P.III */
const PV_TABLE = [
  [18, 4, 6, 0.25, 1, 0.25],
  [24, 4, 0, 0.25, 1, 0],
  [12, 4, 6, 0.25, 1, 0.5],
  [24, 6, 0, 0.25, 1, 0],
  [40, 0, 0, 0.25, 0, 0]
];
function pvCounts(cfg, v) {
  let a = 0,
    b = 0,
    c = 0;
  for (let i = 0; i < cfg.n1; i++) if (keyArr(v.mcq[i]).length) a++;
  for (let q = 0; q < cfg.n2; q++)
    if (
      (v.tf[q] || []).some(function (x) {
        return x === 'D' || x === 'S' || x === 'DS';
      })
    )
      b++;
  for (let q = 0; q < cfg.n3; q++) if (v.num[q]) c++;
  return [a, b, c];
}
function pvAutoPts(cfg, v) {
  const n = pvCounts(cfg, v),
    t = PV_TABLE.find(function (r) {
      return r[0] === n[0] && r[1] === n[1] && r[2] === n[2];
    });
  if (t) return { p1: t[3], p2: t[4], p3: t[5], tab: true };
  /* không có trong bảng: giữ tỉ lệ điểm mặc định, chia để tổng bằng 10 */
  const m = n[0] * cfg.p1 + n[1] * cfg.p2 + n[2] * cfg.p3,
    k = m > 0 ? 10 / m : 1,
    r4 = function (x) {
      return Math.round(x * k * 10000) / 10000;
    };
  return { p1: r4(cfg.p1), p2: r4(cfg.p2), p3: r4(cfg.p3), tab: false };
}
function gradeAll(st, cfg, ver) {
  /* cấu trúc 40·8·6: mỗi mã đề có bảng điểm riêng (tự động theo bảng THPT, hoặc do người dùng đặt) */
  if (cfg.pv && ver) {
    const pt = ver.pt || pvAutoPts(cfg, ver);
    cfg = Object.assign({}, cfg, { p1: pt.p1, p2: pt.p2, p3: pt.p3 });
  }
  const out = {
    p1: { ok: 0, wrong: 0, blank: 0, multi: 0, st: [], pts: 0, max: 0 },
    p2: { st: [], per: [], pts: 0, max: 0 },
    p3: { ok: 0, st: [], pts: 0, max: 0 }
  };
  for (let q = 0; q < cfg.n1; q++) {
    const kq = keyArr(ver.mcq[q]),
      m = st.p1[q];
    if (!kq.length) {
      out.p1.st.push('skip');
      continue;
    }
    out.p1.max += cfg.p1;
    /* chọn cả 4 đáp án A, B, C, D = câu lỗi: ai cũng được điểm */
    if (kq.length === 4) {
      out.p1.st.push('ok');
      out.p1.ok++;
      continue;
    }
    if (m.length === 0) {
      out.p1.st.push('blank');
      out.p1.blank++;
    } else if (m.length > 1) {
      out.p1.st.push('multi');
      out.p1.multi++;
    } else if (kq.indexOf(m[0]) >= 0) {
      out.p1.st.push('ok');
      out.p1.ok++;
    } else {
      out.p1.st.push('wrong');
      out.p1.wrong++;
    }
  }
  out.p1.pts = out.p1.ok * cfg.p1;
  for (let q = 0; q < cfg.n2; q++) {
    const kk = ver.tf[q] || [null, null, null, null],
      items = [];
    let cnt = 0,
      graded = 0;
    for (let r = 0; r < 4; r++) {
      const kv = kk[r],
        sv = st.p2[q][r];
      if (kv === null || kv === undefined) {
        items.push('skip');
        continue;
      }
      graded++;
      if (sv && sv !== 'X' && tfHas(kv, sv)) {
        cnt++;
        items.push('ok');
      } else items.push(sv === '' ? 'blank' : 'wrong');
    }
    /* cfg.p2e: chia đều điểm, mỗi ý đúng được 1/4 điểm của câu; mặc định tính theo thang 10% - 25% - 50% - 100% */
    const frac = cfg.p2e ? (graded ? cnt / graded : 0) : graded === 4 ? TF_LADDER[cnt] : graded ? cnt / graded : 0;
    out.p2.per.push({ cnt: cnt, graded: graded, items: items, pts: frac * cfg.p2 });
    out.p2.st.push(graded ? (cnt === graded ? 'ok' : cnt === 0 ? 'wrong' : 'part') : 'skip');
    if (graded) out.p2.max += cfg.p2;
    out.p2.pts += frac * cfg.p2;
  }
  for (let q = 0; q < cfg.n3; q++) {
    const kq = ver.num[q],
      s = st.p3[q];
    if (!kq) {
      out.p3.st.push('skip');
      continue;
    }
    out.p3.max += cfg.p3;
    if (kq === '*') {
      out.p3.st.push('ok');
      out.p3.ok++;
      out.p3.pts += cfg.p3;
      continue;
    } /* câu lỗi đề: ai cũng được điểm */
    if (!s) out.p3.st.push('blank');
    else if (numEq(s, kq)) {
      out.p3.st.push('ok');
      out.p3.ok++;
      out.p3.pts += cfg.p3;
    } else out.p3.st.push('wrong');
  }
  out.total = out.p1.pts + out.p2.pts + out.p3.pts;
  out.max = out.p1.max + out.p2.max + out.p3.max;
  return out;
}

/* ---------- Quét trực tiếp: chỉ tìm 4 ô neo + hướng phiếu, đủ nhẹ để chạy mỗi khung hình ---------- */
function detectFrame(imgData, w, h) {
  const g = markGray(imgData.data, w * h);
  const cands = findMarkers(imgData.data, w, 0, 0, w, h);
  if (cands.length < 4) return { found: 0, cands: cands };
  const quad = pickQuad(cands, w, h, null, true);
  if (!quad) return { found: 0, cands: cands };
  const fit = orient(g, w, h, quad.pts);
  let area = 0;
  for (let i = 0; i < 4; i++) {
    const p = quad.pts[i],
      q = quad.pts[(i + 1) % 4];
    area += p[0] * q[1] - q[0] * p[1];
  }
  area = Math.abs(area) / 2;
  let side = 0;
  quad.pts.forEach(function (p) {
    let best = null;
    cands.forEach(function (c) {
      const d = Math.hypot(c.cx - p[0], c.cy - p[1]);
      if (!best || d < best.d) best = { d: d, s: c.side };
    });
    side += best ? best.s : 6;
  });
  return {
    found: fit ? 2 : 1,
    pts: fit ? fit.P : quad.pts,
    side: side / 4,
    areaFrac: area / (w * h),
    cands: cands
  };
}

/* ---------- Quét trực tiếp, bản nhanh: chỉ tìm ô vuông trong 4 ô cửa sổ ở bốn góc khung ---------- */
/* wins: 4 hình chữ nhật [x0, y0, x1, y1] theo thứ tự góc trên trái, trên phải, dưới phải, dưới trái. */
function detectCorners(imgData, w, h, wins) {
  const g = markGray(imgData.data, w * h),
    pts = [],
    sides = [];
  for (let k = 0; k < 4; k++) {
    const x0 = Math.max(0, Math.floor(wins[k][0])),
      y0 = Math.max(0, Math.floor(wins[k][1]));
    const x1 = Math.min(w, Math.ceil(wins[k][2])),
      y1 = Math.min(h, Math.ceil(wins[k][3]));
    const cw = x1 - x0,
      ch = y1 - y0;
    if (cw < 16 || ch < 16) return { found: 0, miss: k };
    let best = null;
    findMarkers(imgData.data, w, x0, y0, cw, ch).forEach(function (sh) {
      if (!best || sh.n > best.n) best = sh;
    });
    if (!best) return { found: 0, miss: k };
    pts.push([best.cx, best.cy]);
    sides.push(best.side);
  }
  let area = 0;
  for (let i = 0; i < 4; i++) {
    const p = pts[i],
      q = pts[(i + 1) % 4];
    area += p[0] * q[1] - q[0] * p[1];
  }
  area = Math.abs(area) / 2;
  const fit = orient(g, w, h, pts);
  /* 4 ô neo nằm đúng thế tờ phiếu đặt thẳng trong khung nhưng chưa phân biệt được chiều (ảnh mờ, vòng tròn mờ):
     vẫn cho chấm thử ở độ phân giải cao, nơi nhận chiều chắc hơn. */
  const dd = function (a, b) {
      return Math.hypot(pts[a][0] - pts[b][0], pts[a][1] - pts[b][1]);
    },
    asp = (CORNERS[1][0] - CORNERS[0][0]) / (CORNERS[3][1] - CORNERS[0][1]),
    ratio = (dd(0, 1) + dd(3, 2)) / (dd(0, 3) + dd(1, 2));
  return {
    found: fit ? 2 : 1,
    plausible: ratio > asp * 0.65 && ratio < asp * 1.4 && area > 0,
    pts: fit ? fit.P : pts,
    side: (sides[0] + sides[1] + sides[2] + sides[3]) / 4,
    areaFrac: area / (w * h)
  };
}

/* Tạo ảnh chụp giả lập từ chính ảnh phiếu: tô đáp án, chụp nghiêng, lệch sáng, nhiễu. */
function renderPhoto(sheetImg, cfg, marks, o) {
  o = o || {};
  const L = makeLayout(cfg),
    ppm = o.ppm || 6,
    rng = mulberry32((o.seed || 11) + 100);
  const paper = document.createElement('canvas');
  paper.width = Math.round(PW * ppm);
  paper.height = Math.round(PH * ppm);
  const pc = paper.getContext('2d');
  pc.drawImage(sheetImg, 0, 0, paper.width, paper.height);
  pc.setTransform(ppm, 0, 0, ppm, 0, 0);
  if (!o.noMarks) drawMarks(pc, L, marks, o.seed || 11);
  const pd = pc.getImageData(0, 0, paper.width, paper.height).data,
    PWpx = paper.width,
    PHpx = paper.height;
  const DW = o.w || 1200,
    DH = o.h || 1650;
  const dq = o.quad || [
    [130, 150],
    [1090, 95],
    [1150, 1560],
    [70, 1500]
  ];
  const Hi = solveHomography(dq, [
    [0, 0],
    [PW, 0],
    [PW, PH],
    [0, PH]
  ]);
  const out = document.createElement('canvas');
  out.width = DW;
  out.height = DH;
  const oc = out.getContext('2d'),
    img = oc.createImageData(DW, DH),
    od = img.data;
  const light = o.light === undefined ? 0.25 : o.light,
    noise = o.noise === undefined ? 10 : o.noise;
  for (let v = 0; v < DH; v++) {
    for (let u = 0; u < DW; u++) {
      const d = Hi[6] * u + Hi[7] * v + 1;
      const x = (Hi[0] * u + Hi[1] * v + Hi[2]) / d,
        y = (Hi[3] * u + Hi[4] * v + Hi[5]) / d;
      const p = (v * DW + u) * 4;
      let r, g, b;
      if (x >= 0 && y >= 0 && x <= PW && y <= PH) {
        const fx = Math.min(x * ppm, PWpx - 1.001),
          fy = Math.min(y * ppm, PHpx - 1.001);
        const x0 = fx | 0,
          y0 = fy | 0,
          tx = fx - x0,
          ty = fy - y0,
          i00 = (y0 * PWpx + x0) * 4,
          i01 = i00 + 4,
          i10 = i00 + PWpx * 4,
          i11 = i10 + 4;
        r = (pd[i00] * (1 - tx) + pd[i01] * tx) * (1 - ty) + (pd[i10] * (1 - tx) + pd[i11] * tx) * ty;
        g =
          (pd[i00 + 1] * (1 - tx) + pd[i01 + 1] * tx) * (1 - ty) +
          (pd[i10 + 1] * (1 - tx) + pd[i11 + 1] * tx) * ty;
        b =
          (pd[i00 + 2] * (1 - tx) + pd[i01 + 2] * tx) * (1 - ty) +

  /* ---------- Lưu file về máy ---------- */
  async function saveFile(name, data) {
    if (!data) return 'unavailable';
    if (!window.claude) {
      try {
        const blob = data instanceof Blob ? data : new Blob([data]),
          a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 1500);
        return 'saved';
      } catch (e) {
        return 'unavailable';
      }
    }
    let dl = null;
    try {
      dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    } catch (e) {
      dl = null;
    }
    if (!dl) return 'unavailable';
    try {
      await dl.save({ filename: name, data: data });
      return 'saved';
    } catch (e) {
      saveFile.err = (e && (e.code || e.message)) || 'lỗi không rõ';
      return e && e.code === 'declined' ? 'declined' : 'unavailable';
    }
  }
  /* ---------- Ảnh mẫu ---------- */
  /* Ảnh phiếu nằm ở file riêng: nạp qua fetch thành blob để vẽ lên canvas và đọc điểm ảnh được (không bị chặn
     do khác nguồn). Nếu fetch không dùng được thì nạp thẳng bằng đường dẫn. */
  function loadImgUrl(src) {
    return new Promise(function (res) {
      const im = new Image();
      im.onload = function () {
        res(im);
      };
      im.onerror = function () {
        res(null);
      };
      im.src = src;
    });
  }
  async function loadImg(src) {
    try {
      const r = await fetch(src);
      if (r.ok) {
        const im = await loadImgUrl(URL.createObjectURL(await r.blob()));
        if (im) return im;
      }
    } catch (e) {
      /* dùng cách nạp thẳng */
    }
    return loadImgUrl(src);
  }
  const sheetFReady = loadImg(SHEET_F_JPG),
    sheetMReady = loadImg(SHEET_M_JPG),

  const curSheetImg = function () {

  function buildMarks(ver) {
    const rng = mulberry32(5),
      m = { p1: [], p2: [], p3: [] };
    for (let q = 0; q < cfg.n1; q++) {
      const kq = keyArr(ver.mcq[q])[0],
        right = kq === undefined ? Math.floor(rng() * 4) : kq;
      const other = function () {
        let x;
        do {
          x = Math.floor(rng() * 4);
        } while (x === right);
        return x;
      };
      if (q === 4 || q === 13) m.p1.push([other()]);
      else if (q === 9) m.p1.push([]);
      else if (q === 16) m.p1.push([right, other()]);
      else m.p1.push([right]);
    }
    for (let q = 0; q < cfg.n2; q++) {
      const flip = [[], [1], [0, 2], [0, 1, 2]][q % 4],
        row = [];
      for (let r = 0; r < 4; r++) {
        const kv = (ver.tf[q][r] || 'D').charAt(0),
          wrong = flip.indexOf(r) >= 0;
        row.push(wrong ? (kv === 'D' ? 'S' : 'D') : kv);
      }
      m.p2.push(row);
    }
    for (let q = 0; q < cfg.n3; q++) {
      const key = (ver.num[q] === '*' ? '1' : ver.num[q]) || '';
      m.p3.push(q === 2 ? '13' : q === 4 ? '' : key);
    }
    m.sbd = '24011234'.split('');
    m.md = (ver.code || '0101').padEnd(4, '0').slice(0, MD_X.length).split('');
    return m;
  }

  /* ---------- Nạp ảnh ---------- */
  async function fileToCanvas(file, maxEdge) {
    let src = null,
      w = 0,
      h = 0,
      url = null;
    try {
      src = await createImageBitmap(file, { imageOrientation: 'from-image' });
      w = src.width;
      h = src.height;
    } catch (e) {
      url = URL.createObjectURL(file);
      src = await new Promise(function (res, rej) {
        const im = new Image();
        im.onload = function () {
          res(im);
        };
        im.onerror = rej;
        im.src = url;
      });
      w = src.naturalWidth;
      h = src.naturalHeight;
    }
    const k = Math.min(1, (maxEdge || 1500) / Math.max(w, h));
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * k);
    cv.height = Math.round(h * k);
    const c = cv.getContext('2d', { willReadFrequently: true });

    else if (LV.cd < 60) LV.edge = Math.min(800, (LV.edge || 800) * 1.06);
    const now = Date.now();
    /* Ánh sáng không đều làm cửa sổ nhỏ ở góc khó thấy ô vuông, trong khi phân tích cả vùng khung vẫn nhận
       được phiếu. Khi đó dùng kết quả phân tích cả vùng để vẫn cho chấm. */
    if (d.found < 2 && now >= LV.cool && now - (LV.fbT || 0) > Math.max(300, (LV.rc || 0) * 2.5)) {
      LV.fbT = now;
      try {
        const rd = lvReadT(v);
        if (rd && rd.scan && rd.scan.P) {
          const f = k / rd.k,
            P = rd.scan.P.map(function (p) {
              return [p[0] * f, p[1] * f];
            });
          let ar = 0;
          for (let i = 0; i < 4; i++) {
            const p = P[i],
              q = P[(i + 1) % 4];
            ar += p[0] * q[1] - q[0] * p[1];
          }
          d = {
            found: 2,
            pts: P,
            side: Math.max(4, MS * rd.scan.ppm * f),
            areaFrac: Math.abs(ar) / 2 / (w * h),
            fb: true
          };
          LV.rd = rd;
          LV.rdT = now;
          lvShowScore(rd);
        }
      } catch (e) {
        /* bỏ qua */
      }
    }
    if (LV.needLeave) {
      if (d.found === 2 || (d.found === 1 && d.plausible)) LV.leaveMiss = 0;
      else LV.leaveMiss++;
    }
    if (now < LV.cool || (LV.needLeave && LV.leaveMiss < 4)) {
      if (now >= LV.cool && LV.needLeave) lvMsg('Đã chấm xong. Bỏ phiếu ra rồi đưa tờ tiếp theo vào');
      lvOverlay(d.found === 2 || (d.found === 1 && d.plausible) ? d.pts : null, 'ok');
      LV.timer = setTimeout(lvTick, 120);
      return;
    }
    LV.needLeave = false;
    const minArea = { s: 0.06, m: 0.11, e: 0.11 }[SHEET.id] || 0.14;
    if ((d.found === 2 || (d.found === 1 && d.plausible)) && d.areaFrac >= minArea) {
      LV.side = d.side;
      LV.hint = { pts: d.pts, k: k };
      const diag = Math.hypot(w, h);
      LV.stable = lvSameQuad(LV.last, d.pts, diag) ? LV.stable + 1 : 1;
      LV.last = d.pts;
      LV.miss = 0;
      if (LV.stable < 2) LV.t0 = 0;
      else if (!LV.t0) LV.t0 = Date.now();
      const HOLD = 0,
        el = LV.t0 ? Date.now() - LV.t0 : 0;
      const t = Date.now();
      if (LV.stable >= 1 && t - LV.rdT > Math.max(450, (LV.rc || 0) * 2.5)) {
        LV.rdT = t;
        try {
          LV.rd = lvReadT(v, LV.hint);
        } catch (e) {
          LV.rd = null;
        }
        lvShowScore(LV.rd);
      }
      lvOverlay(d.pts, LV.stable >= 2 ? 'ok' : 'wait', $('#lvLive').checked ? LV.rd : null);
      $('#lvBar').style.width = LV.t0 ? '100%' : '40%';
      lvMsg(LV.t0 ? 'Đã nhận 4 góc, đang chấm…' : 'Đã thấy phiếu');
      if (LV.t0 && el >= HOLD) {
        LV.t0 = 0;
        lvCapture(false);
        return;
      }
    } else {
      LV.miss++;
      if (LV.miss > 2) {
        LV.stable = 0;
        LV.t0 = 0;
        LV.last = null;
        $('#lvBar').style.width = '0';
      }
      if (d.found >= 1 && d.areaFrac < minArea) lvMsg('Đưa máy lại gần hơn để phiếu choán khung');
      else if (d.found === 1) lvMsg('Thấy 4 góc nhưng chưa rõ chiều phiếu, giữ máy thẳng hơn');
      else lvMsg('Đặt 4 ô vuông đen của phiếu vào 4 ô sáng ở góc');
      lvOverlay(d.found >= 1 ? d.pts : null, 'wait');
      if (LV.miss > 4) {
        LV.rd = null;
        lvShowScore(null);
      }
    }
    LV.timer = setTimeout(lvTick, Math.max(90, Math.min(300, LV.cd || 0)));
  }
  async function lvCapture(manual) {
    if (LV.busy) return;
    LV.busy = true;
    const v = $('#lvVideo');
    let s = null,
      errMsg = '';
    try {
      lvMsg('Đang chấm…');
      const hint0 = LV.hint,
        RG = lvRegion(v, 1600),
        cv = document.createElement('canvas');
      cv.width = RG.w;
      cv.height = RG.h;
      cv.getContext('2d', { willReadFrequently: true }).drawImage(
        v,
        RG.rx,
        RG.ry,
        RG.rw,
        RG.rh,
        0,
        0,
        cv.width,
        cv.height
      );
      try {
        v.pause();
      } catch (e) {}
      await nextFrame();
      s = buildScan(cv, 'camera', lvHint(hint0, RG.ka));
    } catch (e) {
      errMsg = (e && e.message) || String(e);
      s = { error: 'load', source: 'camera' };
    }
    LV.busy = false;
    LV.stable = 0;
    LV.t0 = 0;
    LV.last = null;
    $('#lvBar').style.width = '0';
    if (s.error) {
      if (manual) {
        scan = s;
        lvStop();
        renderScan();
        return;
      }
      lvMsg(errMsg ? 'Lỗi: ' + errMsg : 'Chưa đọc rõ, giữ yên máy thêm chút');
      try {
        v.play();
      } catch (e) {}
      LV.cool = Date.now() + 700;
      LV.timer = setTimeout(lvTick, 150);
      return;
    }
    if ($('#lvCont').checked) {
      let g;
      try {
        g = pushResult(s);
        LV.count++;
        $('#lvChip').textContent = 'Đã chấm ' + LV.count + ' tờ';
        const e = $('#lvLast');
        e.hidden = false;
        e.textContent =
          'SBD ' +
          (s.sbdStr || '—') +
          ' · Mã đề ' +
          (s.mdStr || '—') +
          ' · ' +
          fmt(g.total) +
          '/' +
          fmt(g.max) +
          ' điểm' +
          (s.matched ? '' : ' (chưa khớp mã đề, dùng đáp án đang chọn)');
        scan = s;
        s.saved = true;
        lvShowScore({ scan: s, g: g });
      } catch (e) {
        lvMsg('Lỗi: ' + ((e && e.message) || e));
      }
      try {
        v.play();
      } catch (e) {}
      beepDone();
      try {
        lvShowResult(s, g);
      } catch (e) {}
      lvMsg('Đã chấm xong ✓ ' + fmt(g.total) + '/' + fmt(g.max) + ' điểm');
      LV.cool = Date.now() + 5200;
      LV.needLeave = true;
      LV.leaveMiss = 0;
      LV.timer = setTimeout(lvTick, 200);
      return;
    }
    beepDone();
    scan = s;
    lvStop();
    try {
      renderScan();
    } catch (e) {
      $('#scanOut').innerHTML =
        '<div class="card" style="margin-top:14px"><div class="note err"><b>Lỗi hiển thị kết quả.</b><br>' +
        esc((e && e.message) || e) +
        '</div></div>';
    }
    try {
      window.scrollTo(0, 0);
      document.querySelector('#v-scan').scrollIntoView({ block: 'start' });
    } catch (e) {}
  }

  function lvStop() {

    LV.raf = 0;
    if (LV.stream) {
      LV.stream.getTracks().forEach(function (t) {
        t.stop();
      });
      LV.stream = null;
    }
    const v = $('#lvVideo');

      v.srcObject = null;

  /* Tự vẽ hình camera lên canvas (phủ kín khung, cắt theo kiểu "cover") thay vì để thẻ video tự hiển thị:
     có lúc trình duyệt trên điện thoại vẽ video nhỏ lại giữa màn hình khiến 4 góc phiếu lệch khỏi khung. Cách
     tính này trùng đúng với cách tìm vùng phân tích (lvRegion), nên khung hướng dẫn luôn khớp hình. */
  function lvPaint() {
    if (!LV.stream) return;
    LV.raf = requestAnimationFrame(lvPaint);
    const v = $('#lvVideo'),
      cv = $('#lvPrev');
    if (!cv || v.readyState < 2 || !v.videoWidth) return;
    const r = cv.getBoundingClientRect(),
      dpr = Math.min(2, window.devicePixelRatio || 1),
      W = Math.round(r.width * dpr),
      H = Math.round(r.height * dpr);
    if (!W || !H) return;
    if (cv.width !== W || cv.height !== H) {
      cv.width = W;
      cv.height = H;
    }
    const k = Math.max(W / v.videoWidth, H / v.videoHeight),
      dw = v.videoWidth * k,
      dh = v.videoHeight * k;
    cv.getContext('2d').drawImage(v, (W - dw) / 2, (H - dh) / 2, dw, dh);
  }

  /* ---------- Hiển thị kết quả chấm ---------- */
  function grade() {
    return gradeAll({ p1: scan.p1, p2: scan.p2, p3: scan.p3 }, cfg, cfg.versions[scan.ver]);
  }
  function ringPtsPhoto(sc, b, f) {
    const H = hOf(sc.HB, b.y),
      pts = [];
    for (let i = 0; i < 20; i++) {
      const t = (i * Math.PI) / 10;
      pts.push(applyH(H, b.x + RB * f * Math.cos(t), b.y + RB * f * Math.sin(t)));
    }
    return pts;
  }
  function paintMarks(c, sc, g, ver, lw, ringFn) {
    c.lineJoin = 'round';
    const ringPts =
      ringFn ||
      function (sc2, b, f) {
        return ringPtsPhoto(sc2, b, f);
      };
    function poly(pts, col, dash, w) {
      c.beginPath();
      pts.forEach(function (p, i) {
        if (i) c.lineTo(p[0], p[1]);
        else c.moveTo(p[0], p[1]);
      });
      c.closePath();
      c.setLineDash(dash ? [lw * 1.4, lw * 1.1] : []);
      c.strokeStyle = col;
      c.lineWidth = w || lw;
      c.stroke();
      c.setLineDash([]);
    }
    const GOOD = '#1fb86a',
      BAD = '#ff4b3e',
      NEU = '#9aa3b5',
      KEY = '#1fb86a';
    sc.L.p1.forEach(function (b) {
      const st = g.p1.st[b.q],
        isSel = sc.p1[b.q].indexOf(b.o) >= 0,
        isKey = keyArr(ver.mcq[b.q]).indexOf(b.o) >= 0;
      if (isSel) poly(ringPts(sc, b, 1.4), st === 'ok' ? GOOD : st === 'skip' ? NEU : BAD, false);
      else if (isKey && st !== 'ok') poly(ringPts(sc, b, 1.4), KEY, true, lw * 0.9);
    });
    sc.L.p2.forEach(function (b) {
      const sv = sc.p2[b.q][b.r],
        kv = ver.tf[b.q][b.r],
        mine = b.s === 0 ? 'D' : 'S';
      const isSel = sv === mine || sv === 'X';
      if (isSel)
        poly(ringPts(sc, b, 1.4), kv === null ? NEU : tfHas(kv, mine) && sv !== 'X' ? GOOD : BAD, false);
      else if (tfHas(kv, mine) && !(sv && sv !== 'X' && tfHas(kv, sv)))
        poly(ringPts(sc, b, 1.4), KEY, true, lw * 0.9);
    });
    sc.L.p3.forEach(function (b) {
      const cells = numToCells(sc.p3[b.q]),
        st = g.p3.st[b.q];
      if (
        cells.some(function (m) {
          return m.c === b.c && m.k === b.k;
        })
      )
        poly(ringPts(sc, b, 1.4), st === 'ok' ? GOOD : st === 'skip' ? NEU : BAD, false);
      else if (
        st !== 'ok' &&
        st !== 'skip' &&
        numToCells(ver.num[b.q]).some(function (m) {
          return m.c === b.c && m.k === b.k;
        })
      )
        poly(ringPts(sc, b, 1.4), KEY, true, lw * 0.9);
    });
    sc.L.sbd.forEach(function (b) {
      if (sc.sbd[b.c] === String(b.d)) poly(ringPts(sc, b, 1.45), 'rgba(60,130,255,0.95)', false, lw * 0.9);
    });
    sc.L.md.forEach(function (b) {
      if (sc.md[b.c] === String(b.d)) poly(ringPts(sc, b, 1.45), 'rgba(60,130,255,0.95)', false, lw * 0.9);
    });
  }
  function drawOverlay() {
    const cv = scan.view,
      c = cv.getContext('2d'),
      g = grade(),
      ver = cfg.versions[scan.ver];
    c.drawImage(scan.photo, 0, 0);
    const lw = Math.max(1.8, scan.ppm * 0.28);
    c.strokeStyle = 'rgba(60,130,255,0.9)';
    c.lineWidth = Math.max(2, lw);
    c.setLineDash([]);
    c.beginPath();
    scan.P.forEach(function (p, i) {
      if (i) c.lineTo(p[0], p[1]);
      else c.moveTo(p[0], p[1]);
    });
    c.closePath();
    c.stroke();
    paintMarks(c, scan, g, ver, lw);
    (scan.anchors || []).forEach(function (a) {
      c.beginPath();
      c.arc(a[0], a[1], Math.max(4, scan.ppm * 1.5), 0, Math.PI * 2);
      c.lineWidth = Math.max(2, lw);
      c.strokeStyle = a[2] ? 'rgba(31,184,106,0.95)' : 'rgba(255,160,30,0.95)';
      c.stroke();
    });
  }

  const PN = ['I', 'II', 'III'];

        ],

        ],

        ]
      }[scan.error] || ['Không đọc được phiếu.', 'Chụp lại với đủ sáng.'];
      out.innerHTML =
        '<div class="card" style="margin-top:14px"><div class="note err"><b>' +
        msgs[0] +
        '</b><br>' +
        msgs[1] +
        '</div></div>';
      return;
    }
    const g = grade(),
      ver = cfg.versions[scan.ver],
      sample = scan.source === 'sample';
    const parts = [
      [g.p1, cfg.n1],
      [g.p2, cfg.n2],
      [g.p3, cfg.n3]
    ];
    let h = '<div class="card" style="margin-top:14px">';
    if (sample)
      h +=
        '<div><span class="tag">Ảnh mẫu</span> <span class="hint">' + 'Phiếu chấm minh hoạ' + '</span></div>';
    h +=
      '<div class="gradebox"><div class="grade" role="img" aria-label="Điểm ' +
      fmt(g.total) +
      ' trên ' +

  /* Ảnh nắn phẳng: cắt đúng vùng nhận dạng (giữa 4 ô neo, chừa lề nhỏ) và kéo về hình chữ nhật. Vòng chấm
     vẽ lại từ đáp án khi xem nên sửa bài xong ảnh cũng đổi theo. */
  function rectGeom(outW) {
    const x0 = CORNERS[0][0],
      y0 = CORNERS[0][1],
      gw = CORNERS[1][0] - x0,
      gh = CORNERS[3][1] - y0,
      M = Math.min(gw, gh) * 0.035,
      K = outW / (gw + 2 * M);
    return {
      x0: x0,
      y0: y0,
      gw: gw,
      gh: gh,
      M: M,
      K: K,
      W: Math.round((gw + 2 * M) * K),
      H: Math.round((gh + 2 * M) * K)
    };
  }
  function rectCanvas(s, outW) {
    const g = rectGeom(outW || 720),
      cv = document.createElement('canvas');
    cv.width = g.W;
    cv.height = g.H;
    const c = cv.getContext('2d'),
      ph = s.photo,
      sw = ph.width,
      sh = ph.height;
    const src = ph.getContext('2d').getImageData(0, 0, sw, sh).data,
      out = c.createImageData(g.W, g.H),
      od = out.data;
    for (let y = 0; y < g.H; y++) {
      const ly = y / g.K - g.M + g.y0,
        H = hOf(s.HB, ly);
      for (let x = 0; x < g.W; x++) {
        const lx = x / g.K - g.M + g.x0,
          d = H[6] * lx + H[7] * ly + 1,
          u = (H[0] * lx + H[1] * ly + H[2]) / d,
          v = (H[3] * lx + H[4] * ly + H[5]) / d,
          o = (y * g.W + x) * 4;
        if (u >= 0 && v >= 0 && u <= sw - 1 && v <= sh - 1) {
          const x0 = u | 0,
            y0 = v | 0,
            x1 = Math.min(x0 + 1, sw - 1),
            y1 = Math.min(y0 + 1, sh - 1),
            fx = u - x0,
            fy = v - y0;
          const i00 = (y0 * sw + x0) * 4,
            i10 = (y0 * sw + x1) * 4,
            i01 = (y1 * sw + x0) * 4,
            i11 = (y1 * sw + x1) * 4;
          for (let k = 0; k < 3; k++)
            od[o + k] =
              (src[i00 + k] * (1 - fx) + src[i10 + k] * fx) * (1 - fy) +
              (src[i01 + k] * (1 - fx) + src[i11 + k] * fx) * fy;
          od[o + 3] = 255;
        } else {
          od[o] = od[o + 1] = od[o + 2] = 235;
          od[o + 3] = 255;
        }
      }
    }
    c.putImageData(out, 0, 0);
    return cv;
  }

  /* Thí sinh ứng với một số báo danh (bỏ số 0 đứng đầu); không có thì trả null. */
  function stuOf(sbd) {
    const t = String(sbd || '');
    if (!t || /[?_]/.test(t)) return null;
    const k = stuKey(t);
    return k ? stuMap().get(k) || null : null;
  }
  function stuLabel(s) {
    return s.name + (s.cls ? ' · ' + s.cls : '');
  }
  /* Dòng hiện tên học sinh dưới ô số báo danh. */
  function nameLineHTML(sbd) {
    if (!stuList().length) return '';
    const s = stuOf(sbd);
    if (s) return '<b>' + esc(s.name) + '</b>' + (s.cls ? ' · ' + esc(s.cls) : '');
    return '<span class="stu-no">Số báo danh này không có trong danh sách thí sinh.</span>';
  }

    l.students = arr;
    saveLists();

  /* Giải mã văn bản CSV / TSV thành mảng các dòng. */
  function parseDelim(text) {
    text = String(text).replace(/^﻿/, '');
    const first = text.split(/\r?\n/).find(function (x) {
      return x.trim();
    });
    if (!first) return [];
    const cnt = function (ch) {
      return first.split(ch).length - 1;
    };
    let d = '\t',
      best = cnt('\t');
    [';', ','].forEach(function (c) {
      if (cnt(c) > best) {
        best = cnt(c);
        d = c;
      }
    });
    const rows = [];
    let row = [],
      cell = '',
      q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') {
          if (text[i + 1] === '"') {
            cell += '"';
            i++;
          } else q = false;
        } else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === d) {
        row.push(cell);
        cell = '';
      } else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell);
        cell = '';
        rows.push(row);
        row = [];
      } else cell += ch;
    }
    row.push(cell);
    rows.push(row);
    return rows;
  }
  const plain = function (s) {
    return String(s == null ? '' : s)
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .replace(/đ/gi, 'd')
      .toLowerCase()
      .replace(/\s+/g, ' ')
      .trim();
  };
  const cellText = function (v) {
    if (typeof v === 'number') return Number.isInteger(v) ? String(v) : String(Math.round(v));
    return String(v == null ? '' : v)
      .replace(/\s+/g, ' ')
      .trim();
  };
  /* Tìm cột số báo danh, họ tên, lớp trong bảng (dòng tiêu đề nằm trong 15 dòng đầu); nếu không có tiêu đề thì lấy
     cột 1 = số báo danh, cột 2 = họ tên, cột 3 = lớp. */
  function parseRoster(rows) {
    rows = (rows || []).filter(function (r) {
      return (
        Array.isArray(r) &&
        r.some(function (c) {
          return cellText(c) !== '';
        })
      );
    });
    const idScore = function (h) {
      if (/^(so )?bao danh$|^sbd$|so bao danh/.test(h)) return 4;
      if (/so thu tu|^ma (hs|hoc sinh|thi sinh|ts)$|^ma$|^so$/.test(h)) return 3;
      if (/^stt$|^tt$/.test(h)) return 1;
      return 0;
    };
    const isName = function (h) {
      return /^ho (va )?ten|^ho ten|^ten (hoc sinh|thi sinh)|^(ho va ten|hoten)$|^ten$/.test(h);
    };
    let head = -1,
      cI = -1,
      cN = -1,
      cL = -1,
      cH = -1,
      cT = -1;
    for (let r = 0; r < Math.min(15, rows.length) && head < 0; r++) {
      const hs = rows[r].map(function (c) {
        return plain(cellText(c));
      });
      let bi = -1,
        bs = 0,
        bn = -1,
        bl = -1,
        bh = -1,
        bt = -1;
      hs.forEach(function (h, i) {
        const s = idScore(h);
        if (s > bs) {
          bs = s;
          bi = i;
        }
        if (bn < 0 && isName(h) && h !== 'ten') bn = i;
        if (bl < 0 && /^lop/.test(h)) bl = i;
        if (bh < 0 && /^ho( dem)?$|^ho va dem$/.test(h)) bh = i;
        if (bt < 0 && h === 'ten') bt = i;
      });
      if (bn < 0 && bh >= 0 && bt >= 0) {
        head = r;
        cI = bi;
        cH = bh;
        cT = bt;
        cL = bl;
      } else if (bn >= 0 || (bt >= 0 && bh < 0 && bi >= 0)) {
        if (bi >= 0) {
          head = r;
          cI = bi;
          cN = bn >= 0 ? bn : bt;
          cL = bl;
        }
      }
    }
    let start = head + 1,
      hdrNames = null;
    if (head < 0) {
      cI = 0;
      cN = 1;
      cL = 2;
      start = rows.length && !/\d/.test(cellText(rows[0][0])) ? 1 : 0;
    } else
      hdrNames = {
        sbd: cellText(rows[head][cI]),
        name: cH >= 0 ? cellText(rows[head][cH]) + ' + ' + cellText(rows[head][cT]) : cellText(rows[head][cN])
      };
    const list = [];
    let skipped = 0,
      dup = 0;
    const seen = {};
    for (let r = start; r < rows.length; r++) {
      const row = rows[r],
        sbd = cellText(row[cI]).replace(/\.0+$/, ''),
        name = (cH >= 0 ? cellText(row[cH]) + ' ' + cellText(row[cT]) : cellText(row[cN]))
          .replace(/\s+/g, ' ')
          .trim(),
        k = stuKey(sbd);
      if (!k || !name) {
        skipped++;
        continue;
      }
      if (seen[k]) {
        dup++;
        continue;
      }
      seen[k] = 1;
      list.push({ k: k, sbd: sbd, name: name.normalize('NFC'), cls: cL >= 0 ? cellText(row[cL]) : '' });
    }
    return { list: list, skipped: skipped, dup: dup, hdr: hdrNames };
  }
  function stuApply(res, srcName) {
    if (!res.list.length) {
      stuMsg = {
        kind: 'err',
        text:
          'Không tìm thấy thí sinh nào trong ' +
          (srcName || 'dữ liệu') +
          '. File cần có cột Số báo danh và cột Họ tên (có thể thêm cột Lớp).'
      };
      return;
    }
    const old = stuList().slice(),
      cur = old.slice(),
      idx = {};
    cur.forEach(function (s, i) {
      idx[s.k] = i;
    });
    let added = 0,
      upd = 0;
    res.list.forEach(function (s) {
      if (idx[s.k] !== undefined) {
        cur[idx[s.k]] = s;
        upd++;
      } else {
        idx[s.k] = cur.length;
        cur.push(s);
        added++;
      }
    });
    stuUndo = old;
    setStudents(cur);
    stuShow = 60;
    stuMsg = {
      kind: 'ok',
      text:
        'Đã nhập ' +
        res.list.length +
        ' thí sinh' +
        (srcName ? ' từ ' + srcName : '') +
        ' (thêm ' +
        added +
        ', cập nhật ' +
        upd +
        ')' +
        (res.hdr
          ? '. Cột số báo danh: “' + res.hdr.sbd + '”, cột họ tên: “' + res.hdr.name + '”'
          : '. Không thấy dòng tiêu đề nên lấy cột 1 là số báo danh, cột 2 là họ tên, cột 3 là lớp') +
        '.' +
        (res.skipped ? ' Bỏ qua ' + res.skipped + ' dòng thiếu số báo danh hoặc họ tên.' : '') +
        (res.dup ? ' Bỏ qua ' + res.dup + ' dòng trùng số báo danh.' : '')

  }
  async function stuFromFile(file) {
    stuMsg = { kind: 'busy' };
    renderStu();
    await nextFrame();
    try {
      let rows = null;
      if (/\.(xlsx|xlsm|xlsb|xls|ods)$/i.test(file.name)) {
        try {
          await loadScript(XLSX_URL);
        } catch (e) {
          stuMsg = {
            kind: 'err',
            text: 'Không tải được bộ đọc Excel (cần kết nối mạng). Hãy lưu file thành CSV rồi chọn lại, hoặc dán danh sách vào ô bên dưới.'
          };
          return;
        }
        const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array' });
        let best = null;
        for (let i = 0; i < wb.SheetNames.length; i++) {
          const r = parseRoster(
            window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]], { header: 1, raw: true, defval: '' })
          );
          if (!best || r.list.length > best.list.length) best = r;
        }
        stuApply(best || parseRoster([]), file.name);

      }
      const buf = await file.arrayBuffer();
      let text = new TextDecoder('utf-8').decode(buf);
      if (text.indexOf('\uFFFD') >= 0) {
        try {
          text = new TextDecoder('windows-1258').decode(buf);
        } catch (e) {
          /* giữ bản UTF-8 */
        }
      }
      rows = parseDelim(text);
      stuApply(parseRoster(rows), file.name);
    } catch (e) {
      stuMsg = { kind: 'err', text: 'Không đọc được file này. Thử lưu lại dưới dạng .xlsx hoặc .csv.' };
    }
  }
  /* Điểm đã chấm mới nhất của từng thí sinh (theo số báo danh). */
  function stuScoreMap() {

  let resSort = LS.get('omr.ressort', 'new') === 'sbd' ? 'sbd' : 'new';
  function sbdSorted(arr) {
    const bad = function (r) {
      return !stuKey(r.sbd) || /[?_]/.test(String(r.sbd));
    };
    return arr.slice().sort(function (a, b) {
      const ba = bad(a),
        bb = bad(b);
      if (ba !== bb) return ba ? 1 : -1;
      if (!ba) {
        const c = stuCmp({ k: stuKey(a.sbd) }, { k: stuKey(b.sbd) });
        if (c) return c;
      }
      return (a.t || 0) - (b.t || 0);
    });
  }

  /* ---------- Sửa lại thông tin bài đã chấm ---------- */
  let ed = null;
  function verForCode(code) {
    const nz = function (c) {
      return String(c).replace(/^0+(?=\d)/, '');
    };
    const i = cfg.versions.findIndex(function (v) {
      return v.code && nz(v.code) === nz(code);
    });
    return cfg.versions[i >= 0 ? i : Math.min(cfg.active, cfg.versions.length - 1)];
  }
  function loadBlobImage(blob) {
    return new Promise(function (res) {
      const u = URL.createObjectURL(blob),
        im = new Image();
      im.onload = function () {
        res(im);
      };
      im.onerror = function () {
        res(null);
      };
      im.src = u;
    });
  }
  async function openEdit(id) {
    const r = results.find(function (x) {
      return String(x.id) === String(id);
    });

      sheet = r.sheet || cfg.sheet,
      cs = r.cs || csOf();
    ed = {
      id: r.id,
      sbd: r.sbd || '',
      md: r.md || '',
      hasAns: !!a,
      total: r.total,
      max: r.max,
      sheet: sheet,
      cs: cs,
      base: null,
      legacy: false,
      msg: '',
      p1: a
        ? a.p1.map(function (m) {
            return m.slice();
          })
        : null,
      p2: a
        ? a.p2.map(function (x) {
            return x.slice();
          })
        : null,
      p3: a ? a.p3.slice() : null
    };
    $('#resEdit').hidden = false;
    $('#reBody').innerHTML = '<div class="busy"><span class="spin"></span>Đang mở bài…</div>';
    if (r.img) {
      try {
        const b = await IMG.get(r.id);
        if (b) {
          ed.base = await loadBlobImage(b);
          ed.blob = b;
          ed.legacy = !r.rect;

        { L: makeLayout(ed.cs), p1: ed.p1, p2: ed.p2, p3: ed.p3, sbd: ed.sbd.split(''), md: ed.md.split('') },

        String(ed.total).replace('.', ',') +

  async function exportCsv() {
    const rows = [
      [
        'Thời gian',
        'Số báo danh',
        'Họ tên',
        'Lớp',
        'Mã đề',
        'Phần I',
        'Phần II',
        'Phần III',
        'Tổng điểm',
        'Điểm tối đa'
      ]
    ];
    const lr = resSort === 'sbd' ? sbdSorted(listRes()) : listRes().slice().reverse(),
      cnt = [0, 0, 0];
    lr.forEach(function (r) {
      const an = r.ans || {};
      ['p1', 'p2', 'p3'].forEach(function (k, i) {
        cnt[i] = Math.max(cnt[i], (an[k] || []).length);
      });
    });
    ['I', 'II', 'III'].forEach(function (nm, i) {
      for (let q = 1; q <= cnt[i]; q++) rows[0].push('Phần ' + nm + ' - Câu ' + q);
    });
    lr.forEach(function (r) {
      const p = r.parts || ['', '', ''];
      const st = stuOf(r.sbd);
      rows.push([
        new Date(r.t).toLocaleString('vi-VN'),
        r.sbd,
        st ? st.name : '',
        st ? st.cls : '',
        r.md,
        p[0],
        p[1],
        p[2],
        r.total,
        r.max
      ]);
      const an = r.ans || {},
        row = rows[rows.length - 1];
      for (let q = 0; q < cnt[0]; q++) {
        const m = (an.p1 && an.p1[q]) || [];
        row.push(
          m
            .map(function (o) {

  function buildPdf(pages) {

      chunks = [],
      offs = [];

    const put = function (x) {
      const u = typeof x === 'string' ? enc.encode(x) : x;
      chunks.push(u);
      len += u.length;
    };
    const obj = function (n, body) {
      offs[n] = len;
      put(n + ' 0 obj\n');
      if (typeof body === 'string') put(body);
      else body.forEach(put);
      put('\nendobj\n');
    };
    put('%PDF-1.4\n');
    const N = pages.length,
      kids = [];
    for (let i = 0; i < N; i++) kids.push(3 + i * 3 + ' 0 R');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + N + ' >>');
    pages.forEach(function (p, i) {
      const pn = 3 + i * 3,
        cn = pn + 1,
        im = pn + 2,
        W = 595.28,
        H = 841.89,
        cont = 'q ' + W + ' 0 0 ' + H + ' 0 0 cm /Im0 Do Q';
      obj(
        pn,
        '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' +
          W +
          ' ' +
          H +
          '] /Resources << /XObject << /Im0 ' +
          im +
          ' 0 R >> >> /Contents ' +
          cn +
          ' 0 R >>'
      );
      obj(cn, '<< /Length ' + cont.length + ' >>\nstream\n' + cont + '\nendstream');
      obj(im, [
        '<< /Type /XObject /Subtype /Image /Width ' +
          p.w +
          ' /Height ' +
          p.h +
          ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' +
          p.jpg.length +
          ' >>\nstream\n',
        p.jpg,
        '\nendstream'
      ]);
    });
    const xr = len,
      total = 3 + N * 3;

    for (let i = 1; i < total; i++) put(String(offs[i]).padStart(10, '0') + ' 00000 n \n');

      })
    ) {
      /* Dạng {"mã đề":"Phần I#Phần II (các câu cách nhau _)#Phần III (các số cách nhau _)"} */
      rows = [];
      Object.keys(data).forEach(function (k) {
        const v = data[k];
        if (typeof v !== 'string' || v.indexOf('#') < 0) return;
        /* Phần II và Phần III có thể cách nhau bằng # hoặc nối liền bằng _: tách theo từng đoạn */
        const seg = v.split('#'),
          letters = String(seg[0] || '')
            .replace(/[\s_]/g, '')
            .split(''),
          nums = [];
        seg
          .slice(1)
          .join('_')
          .split('_')
          .forEach(function (t) {
            t = t.trim();
            if (!t) return;
            if (/^[ĐđDdSs*?-]+$/.test(t)) Array.prototype.push.apply(letters, t.split(''));
            else nums.push(t);
          });
        rows.push({ code: k, letters: letters, nums: nums });
      });
      if (!rows.length) return { error: 'shape' };
      return parseKeyRows(rows);
    } else if (data && typeof data === 'object')
      rows = Object.keys(data).map(function (k) {
        return [k].concat(Array.isArray(data[k]) ? data[k] : []);
      });
    else return { error: 'shape' };
    rows = rows.filter(function (r) {
      return Array.isArray(r) && r.length > 1;
    });
    return parseKeyRows(rows);
  }
  /* rows: mỗi phần tử là mảng [mã đề, đáp án…] hoặc đối tượng { code, letters, nums } (dùng khi nhập từ Excel). */
  function parseKeyRows(rows) {
    if (!rows.length) return { error: 'shape' };
    const P = [],
      faulty = [];
    for (let i = 0; i < rows.length; i++) {
      const r = rows[i],
        obj = !Array.isArray(r),
        raw = String(obj ? r.code : r[0])
          .replace(/\D/g, '')
          .slice(0, 4),
        rest = obj ? [] : r.slice(1);
      let j = rest.length;
      while (j > 0 && numLike(rest[j - 1])) j--;
      const letters = (obj ? r.letters : rest.slice(0, j)).map(qrTok);
      if (
        letters.some(function (x) {
          return !/^[ABCDS*-]$/.test(x);
        })
      )
        return { error: 'shape' };
      letters.forEach(function (x, k) {
        if (x === '*') faulty.push({ code: raw, pos: k });
      });
      P.push({ code: raw, letters: letters, nums: obj ? r.nums : rest.slice(j) });
    }
    const L = P[0].letters.length,
      N3 = P[0].nums.length;
    if (
      P.some(function (p) {
        return p.letters.length !== L || p.nums.length !== N3;
      })
    )
      return { error: 'inconsistent' };
    const order = [cfg.sheet].concat(
      ['m', 'f', 's', 'e'].filter(function (id) {
        return id !== cfg.sheet;
      })
    );
    let firstErr = null;
    const fits = [];
    order.forEach(function (id) {
      const s = qrStructure(P, L, N3, id);
      if (s.error) {
        if (!firstErr) firstErr = s.error;
      } else fits.push(Object.assign(s, { sheet: id }));
    });
    if (!fits.length) return { error: firstErr || 'structure' };
    /* ưu tiên loại phiếu có sẵn đúng cấu trúc này (kể cả phiếu đang chọn), nếu không thì giữ phiếu đang chọn */
    const cur = fits.find(function (f) {
      return f.sheet === cfg.sheet;
    });
    const best =
      cur ||
      fits.find(function (f) {
        return f.exact;
      }) ||
      fits[0];
    const warnings = [],
      mismatch = !cur;
    if (mismatch)
      warnings.push(
        'Cấu trúc ' +
          best.n1 +
          ' · ' +
          best.n2 +
          ' · ' +
          N3 +
          ' không phù hợp ' +
          SHEETS[cfg.sheet].name +
          ' mà đợt này đang chọn, nhưng khớp với ' +
          SHEETS[best.sheet].name +
          '.'
      );
    if (best.multi)
      warnings.push(
        'Cấu trúc đề có thể hiểu theo nhiều cách, app chọn ' +
          best.n1 +
          ' câu Phần I và ' +
          best.n2 +
          ' câu Phần II. Kiểm tra lại ở mục Cấu trúc đề.'
      );
    if (faulty.length) {
      const ex = faulty.slice(0, 3).map(function (f) {
        return (
          'mã ' +
          (f.code || '—') +
          ' ' +
          (f.pos < best.n1 ? 'câu ' + (f.pos + 1) : 'Phần II ý ' + (f.pos - best.n1 + 1))
        );
      });
      warnings.push(
        'Có ' +
          faulty.length +
          ' ô ghi 0 (' +
          ex.join(', ') +
          (faulty.length > 3 ? ', …' : '') +
          '): app hiểu là câu lỗi, học sinh nào cũng được điểm câu đó.'
      );
    }
    const vmax = best.sheet === 'f' && best.n1 === 40 && best.n2 === 8 && N3 === 6 ? 100 : 50;
    if (P.length > vmax) warnings.push('Chỉ lấy ' + vmax + ' mã đề đầu tiên.');
    const codes = P.map(function (p) {
      return p.code;
    });
    if (
      codes.some(function (c, i) {
        return c && codes.indexOf(c) !== i;
      })
    )
      warnings.push('Có mã đề bị trùng nhau.');
    const versions = P.slice(0, vmax).map(function (p) {
      const v = emptyVer(p.code);
      for (let i = 0; i < best.n1; i++) {
        const x = p.letters[i];
        v.mcq[i] = x === '*' ? [0, 1, 2, 3] : x === '-' ? null : LET.indexOf(x);
      }
      for (let q = 0; q < best.n2; q++)
        for (let r = 0; r < 4; r++) {
          const x = p.letters[best.n1 + q * 4 + r];
          v.tf[q][r] = x === '*' ? 'DS' : x === '-' ? null : x;
        }
      for (let q = 0; q < N3; q++) v.num[q] = numToKey(p.nums[q]);
      return v;
    });
    const longNum = versions.some(function (v) {
      return v.num.slice(0, N3).some(function (x) {
        return x.length > 4;
      });
    });
    if (longNum) warnings.push('Có đáp án Phần III dài hơn 4 ký tự, học sinh không thể tô hết trên phiếu.');
    return {
      versions: versions,
      n1: best.n1,
      n2: best.n2,
      n3: N3,
      sheet: best.sheet,
      mismatch: mismatch,
      warnings: warnings,
      total: P.length
    };
  }

  /* Bảng đáp án trong Excel: hàng đầu là "Câu\\Mã đề" rồi các mã đề; cột đầu là số câu; mỗi ô là đáp án của
     câu đó ở mã đề tương ứng (Phần I: A–D; Phần II: 4 chữ Đ/S của 4 ý; Phần III: số). Ô để trống là câu không
     chấm, số 0 hoặc dấu * ở Phần I, II là câu lỗi. Trả về { rows } để đưa vào parseKeyRows, hoặc { error }. */
  function excelKeyRows(tbl) {
    const rows = (tbl || []).filter(function (r) {
      return (
        Array.isArray(r) &&
        r.some(function (c) {
          return cellText(c) !== '';
        })
      );
    });
    if (rows.length < 2) return { error: 'xshape' };
    let hi = 0;
    for (let i = 0; i < Math.min(8, rows.length); i++) {
      const cs = rows[i].slice(1).filter(function (c) {
        return cellText(c) !== '';
      });
      if (cs.length && /ma de|cau/.test(plain(cellText(rows[i][0])))) {
        hi = i;
        break;
      }
      if (
        cs.length &&
        cs.every(function (c) {
          return /^\d{2,4}$/.test(cellText(c));
        })
      ) {
        hi = i;
        break;
      }
    }
    const cols = [];
    rows[hi].forEach(function (c, k) {
      const t = cellText(c).replace(/\D/g, '');
      if (k > 0 && t) cols.push({ k: k, code: t.slice(0, 4) });
    });
    if (!cols.length) return { error: 'xshape' };
    const norm = function (c) {
      return String(c == null ? '' : c)
        .replace(/\s+/g, '')
        .toUpperCase()
        .replace(/Đ/g, 'D');
    };
    const kind = function (s) {
      if (/^[A-D]$/.test(s)) return 'L';
      if (/^[DS]{4}$/.test(s)) return 'T';
      return /^-?\d+([.,]\d+)?$/.test(s) && s !== '0' ? 'N' : '';
    };
    const P = cols.map(function (c) {
      return { code: c.code, letters: [], nums: [] };
    });
    const body = rows.slice(hi + 1);
    let prev = 'L';
    for (let i = 0; i < body.length; i++) {
      const vals = cols.map(function (c) {
          return body[i][c.k];
        }),
        cnt = { L: 0, T: 0, N: 0 };
      vals.forEach(function (v) {
        const k = kind(norm(v));
        if (k) cnt[k]++;
      });
      let type = cnt.T >= cnt.L && cnt.T >= cnt.N ? 'T' : cnt.L >= cnt.N ? 'L' : 'N';
      if (!cnt.T && !cnt.L && !cnt.N) type = prev;
      prev = type;
      vals.forEach(function (v, j) {
        const s = norm(v);
        if (type === 'N') P[j].nums.push(typeof v === 'number' ? numToKey(v) : s.replace('.', ','));
        else if (type === 'L') P[j].letters.push(s === '' ? '-' : s === '0' || s === '*' ? '*' : s.charAt(0));
        else if (s === '') P[j].letters.push('-', '-', '-', '-');
        else if (s === '0' || s === '*') P[j].letters.push('*', '*', '*', '*');
        else
          s.slice(0, 4)
            .padEnd(4, '-')
            .split('')
            .forEach(function (ch) {
              P[j].letters.push(ch === 'D' || ch === 'S' ? ch : ch === '0' || ch === '*' ? '*' : '-');
            });
      });
    }
    if (!P[0].letters.length) return { error: 'xshape' };
    return { rows: P };
  }

  async function keyFromFile(file) {
    qrState = { kind: 'busy' };
    renderQr();
    await nextFrame();
    const fail = function (title, body) {
      qrState = { kind: 'error', title: title, body: body };
      renderQr();
    };
    try {
      let tbl = null;
      if (/\.(xlsx|xlsm|xlsb|xls|ods)$/i.test(file.name)) {
        try {
          await loadScript(XLSX_URL);
        } catch (e) {
          fail(
            'Không tải được bộ đọc Excel.',
            'Cần kết nối mạng. Bạn có thể lưu file thành CSV rồi chọn lại.'
          );
          return;
        }
        const wb = window.XLSX.read(await file.arrayBuffer(), { type: 'array' });
        let best = null;
        for (let i = 0; i < wb.SheetNames.length; i++) {
          const t = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[i]], {
              header: 1,
              raw: true,
              defval: ''
            }),
            r = excelKeyRows(t);
          if (!r.error && (!best || r.rows.length > best.rows.length)) best = r;
        }
        if (!best) return fail(QR_ERR.xshape[0], QR_ERR.xshape[1]);
        tbl = best;
      } else {
        const buf = await file.arrayBuffer();
        let text = new TextDecoder('utf-8').decode(buf);
        if (text.indexOf('\uFFFD') >= 0) {
          try {
            text = new TextDecoder('windows-1258').decode(buf);
          } catch (e) {
            /* giữ bản UTF-8 */
          }
        }
        tbl = excelKeyRows(parseDelim(text));
        if (tbl.error) return fail(QR_ERR.xshape[0], QR_ERR.xshape[1]);
      }
      const r = parseKeyRows(tbl.rows);
      if (r.error) {
        const m = QR_ERR[r.error] || QR_ERR.xshape;
        return fail(m[0], m[1]);
      }
      qrState = { kind: 'preview', res: r };
      if (!r.mismatch) applyQr();
      else renderQr();
    } catch (e) {
      fail('Không đọc được file này.', 'Thử lưu lại dưới dạng .xlsx hoặc .csv rồi chọn lại.');
    }
  }
